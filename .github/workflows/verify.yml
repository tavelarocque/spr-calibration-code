name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # highs-sys builds HiGHS with CMake and a C++ compiler and generates bindings with
      # bindgen, which needs libclang. The runner image normally ships all three; apt is only
      # a fallback, because the package mirror can be very slow.
      - name: Check build dependencies for highs-sys (CMake, C++ compiler, libclang)
        run: |
          missing=""
          command -v cmake >/dev/null || missing="$missing cmake"
          command -v c++ >/dev/null || missing="$missing g++"
          ls /usr/lib/llvm-*/lib/libclang*.so* >/dev/null 2>&1 || missing="$missing libclang-dev"
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            sudo timeout 900 apt-get update
            sudo timeout 900 apt-get install -y --no-install-recommends $missing
          fi
          cmake --version | head -1
          c++ --version | head -1
          ls /usr/lib/llvm-*/lib/libclang*.so* | head -3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install || rustup show
          rustc --version
          cargo --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Cache the cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Run the default verification
        run: scripts/verify_all.sh
