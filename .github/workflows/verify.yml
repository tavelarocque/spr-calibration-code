name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies for highs-sys (CMake, C++ compiler, libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang libclang-dev

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install || rustup show
          rustc --version
          cargo --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Cache the cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Run the default verification
        run: scripts/verify_all.sh
