[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
spr-core = { path = "crates/spr-core" }
spr-solve = { path = "crates/spr-solve" }
spr-oblivious = { path = "crates/spr-oblivious" }
clap = { version = "4", features = ["derive"] }
hashbrown = "0.17"
proptest = "1"
rayon = "1"
highs = "2.4"
num-bigint = "0.4"
num-integer = "0.1"
highs-sys = "1.15"
num-rational = "0.4"
num-traits = "0.2"
serde_json = "1"

# The solver is hot loops all the way down; debug-mode tests would take minutes.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
